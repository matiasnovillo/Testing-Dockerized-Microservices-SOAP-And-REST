services:
  fiyistack.blazor:
    image: ${DOCKER_REGISTRY-}fiyistackblazor
    build:
      context: .
      dockerfile: FiyiStack.Blazor/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    volumes:
      - blazor-dataprotection:/app/keys

  fiyistack.api1:
    image: ${DOCKER_REGISTRY-}fiyistackapi1
    build:
      context: .
      dockerfile: FiyiStack.APIWithSOAP/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

  fiyistack.api2:
    image: ${DOCKER_REGISTRY-}fiyistackapi2
    build:
      context: .
      dockerfile: FiyiStack.APIWithREST/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  blazor-dataprotection:
